
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Entrada de datos - Análisis Económico</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f3f4f6;
  color:#1f2937;
}

.pagina{
  padding:24px;
}

.cabecera{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.cabecera h1{
  margin:0;
  font-size:24px;
}

.volver{
  text-decoration:none;
  background:#374151;
  color:white;
  padding:8px 14px;
  border-radius:6px;
  font-size:13px;
  font-weight:bold;
}

/* PANEL ENTRADA */

.panel-entrada{
  background:white;
  border-radius:10px;
  padding:14px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.titulo-seccion{
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}

.linea-entrada{
  display:grid;

  grid-template-columns:
    110px
    190px
    110px
    240px
    120px
    40px
    40px;

  gap:6px;
  align-items:center;
}

select,
input{
  width:100%;
  height:32px;
  padding:4px 7px;
  border:1px solid #d1d5db;
  border-radius:5px;
  font-size:12px;
  background:white;
}

input[type="number"]{
  text-align:right;
}

.boton-icono{
  width:34px;
  height:32px;
  border:0;
  border-radius:5px;
  cursor:pointer;
  font-size:17px;
}

.guardar{
  background:#16a34a;
  color:white;
}

.limpiar{
  background:#dc2626;
  color:white;
}

/* TABLA */

.panel-tabla{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.tabla-contenedor{
  height:560px;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

thead th{
  position:sticky;
  top:0;
  z-index:10;
  background:#1f2937;
  color:white;
  text-align:left;
  padding:9px 10px;
}

tbody td{
  padding:8px 10px;
  border-bottom:1px solid #e5e7eb;
}

tbody tr:hover{
  background:#f9fafb;
}

.cantidad-tabla{
  text-align:right;
  font-weight:bold;
}

.vacio{
  text-align:center;
  padding:35px !important;
  color:#9ca3af;
}

</style>
</head>

<body>

<div class="pagina">

  <div class="cabecera">

    <h1>ENTRADA DE DATOS</h1>

    <a href="Analisis.html" class="volver">
      ← VOLVER
    </a>

  </div>


  <!-- ENTRADA -->

  <div class="panel-entrada">

    <div class="titulo-seccion">
      INTRODUCIR GASTO
    </div>

    <div class="linea-entrada">


      <!-- MES -->

      <select id="mes">

        <option value="">MES</option>

        <option>ENERO</option>
        <option>FEBRERO</option>
        <option>MARZO</option>
        <option>ABRIL</option>
        <option>MAYO</option>
        <option>JUNIO</option>
        <option>JULIO</option>
        <option>AGOSTO</option>
        <option>SEPTIEMBRE</option>
        <option>OCTUBRE</option>
        <option>NOVIEMBRE</option>
        <option>DICIEMBRE</option>

      </select>


      <!-- CUENTA -->

      <select id="cuenta">

        <option value="62800006 - GASOIL">
          62800006 - GASOIL
        </option>

      </select>


      <!-- ORIGEN -->

      <select id="origen">

        <option value="">
          ORIGEN
        </option>

        <option>GERA</option>
        <option>SIG</option>
        <option>DAVID</option>

      </select>


      <!-- PROYECTO -->

      <select id="proyecto">

        <option value="">
          PROYECTO
        </option>

        <option>
          RECICLAJE DE ACEITES Y GRASAS
        </option>

        <option>
          LIMPIEZA INDUSTRIAL
        </option>

        <option>
          LIMPIEZA HOSTELERIA
        </option>

        <option>
          SERVICIOS VARIOS
        </option>

        <option>
          INSTALACION Y REPARACION
        </option>

        <option>
          GASTOS GENERALES
        </option>

        <option>
          TRADER
        </option>

      </select>


      <!-- CANTIDAD -->

      <input
        id="cantidad"
        type="number"
        step="0.01"
        min="0"
        placeholder="0,00 €"
      >


      <!-- GUARDAR -->

      <button
        class="boton-icono guardar"
        onclick="guardarGasto()"
        title="Guardar">
        💾
      </button>


      <!-- LIMPIAR -->

      <button
        class="boton-icono limpiar"
        onclick="limpiarEntrada()"
        title="Limpiar">
        🗑️
      </button>


    </div>

  </div>



  <!-- TABLA HISTORICA -->

  <div class="panel-tabla">

    <div class="tabla-contenedor">

      <table>

        <thead>

          <tr>

            <th style="width:12%">
              MES
            </th>

            <th style="width:22%">
              CUENTA CONTABLE
            </th>

            <th style="width:12%">
              ORIGEN
            </th>

            <th>
              PROYECTO
            </th>

            <th style="width:14%; text-align:right">
              CANTIDAD
            </th>

          </tr>

        </thead>


        <tbody id="tablaGastos">

          <tr id="filaVacia">

            <td colspan="5" class="vacio">
              Todavía no hay gastos introducidos
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>



<script>

function guardarGasto(){

  const mes =
    document.getElementById("mes").value;

  const cuenta =
    document.getElementById("cuenta").value;

  const origen =
    document.getElementById("origen").value;

  const proyecto =
    document.getElementById("proyecto").value;

  const cantidad =
    parseFloat(
      document.getElementById("cantidad").value
    );


  if(!mes){

    alert("Selecciona el mes.");

    return;
  }


  if(!origen){

    alert("Selecciona el origen.");

    return;
  }


  if(!proyecto){

    alert("Selecciona el proyecto.");

    return;
  }


  if(!cantidad || cantidad <= 0){

    alert("Introduce una cantidad.");

    return;
  }


  const filaVacia =
    document.getElementById("filaVacia");

  if(filaVacia){

    filaVacia.remove();

  }


  const tabla =
    document.getElementById("tablaGastos");


  const fila =
    document.createElement("tr");


  fila.innerHTML = `

    <td>${mes}</td>

    <td>${cuenta}</td>

    <td>${origen}</td>

    <td>${proyecto}</td>

    <td class="cantidad-tabla">

      ${cantidad.toLocaleString(
        "es-ES",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      )} €

    </td>

  `;


  tabla.prepend(fila);


  document.getElementById("cantidad").value = "";

}



function limpiarEntrada(){

  document.getElementById("mes").value = "";

  document.getElementById("origen").value = "";

  document.getElementById("proyecto").value = "";

  document.getElementById("cantidad").value = "";

}

</script>


</body>
</html>
